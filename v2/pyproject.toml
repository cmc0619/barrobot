[project]
name = "barrobot"
version = "2.0.0"
description = "A Raspberry Pi controlled 12-bottle cocktail turret"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
  "Flask>=3.1.3,<4",
  "requests>=2.33.0,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<9",
  "ruff>=0.12,<1",
]
rpi = ["RPi.GPIO>=0.7.1"]

[tool.setuptools]
packages = ["barrobot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py310"
line-length = 100
exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
