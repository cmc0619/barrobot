name: v3

on:
  push:
    branches: [main]
    paths:
      - "v3/**"
      - ".github/workflows/ci-v3.yml"
  pull_request:
    paths:
      - "v3/**"
      - ".github/workflows/ci-v3.yml"

permissions:
  contents: read

defaults:
  run:
    working-directory: v3

jobs:
  application:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: v3/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run check
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: node --check web/app.js

  motion:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: make -C motiond test all

  arm64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: sudo apt-get update && sudo apt-get install --yes gcc-aarch64-linux-gnu
      - run: make -C motiond clean all CC=aarch64-linux-gnu-gcc
